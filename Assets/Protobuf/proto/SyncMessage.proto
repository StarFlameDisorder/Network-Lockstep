syntax = "proto3";

import "ConnectMessage.proto";
import "GameMessage.proto";
import "LobbyMessage.proto";

package SyncMessage;

message ServerMessage{
    oneof content{
        string commonMessage = 2;
        ConnectMessage.ServerConnectMessage connectMessage = 3;
        GameMessage.GameSyncMessage gameSyncMessage = 4;
        LobbyMessage.LobbySyncResponse lobbySync = 5;
        GameMessage.GameSnapshotMessage gameSnapshotMessage=6;
        GameMessage.DesyncNoticeMessage desyncNotice=8;
    }
    bool keepAlive = 7; //服务端保活包（客户端收包超时断线检测用，无实际内容）
}

message ClientMessage{
    uint32 clientId = 1;
    oneof content{
        string commonMessage = 2;
        GameMessage.GameSyncMessage gameSyncMessage = 4;
        LobbyMessage.LobbySyncRequest lobbySync=5;
        GameMessage.HeartBeat heartBeat=6;
        GameMessage.GameSnapshotMessage gameSnapshotMessage=7;
        GameMessage.HashReportMessage hashReport=8;
    }
}
