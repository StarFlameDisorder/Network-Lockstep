syntax = "proto3";

package GameMessage;

import "UnityMath.proto";

//帧广播（服务端→客户端）：一帧内所有玩家的输入
message GameSyncMessage{
    uint64 frameId = 1;
    repeated PlayerSync players = 2;
}

//快照/补发帧（断线重连/中途加入恢复）
message GameSnapshotMessage{
    oneof content{
        GameSnapshot snapshot = 1;
        GameFrame frames = 2;
    }
}

message GameSnapshot{
    uint64 frameId = 1;
    repeated PlayerSnapshotSync playerSSs = 2;
    repeated ObjectSnapshotSync objectSSs = 3;
    repeated ItemSnapshotSync itemSSs = 4;
}

message GameFrame{//只由服务器向客户端发送
    uint64 frameId = 1;
    repeated PlayerSync players = 2;
}

//玩家本帧输入 = 命令列表（可同时下达多条命令，如移动+攻击；扩展新操作在此加 oneof 分支）
message PlayerSync
{
    string name = 1;
    uint64 frameId = 2;//服务端统一分配的帧号（客户端缓冲/补发的 Key）
    repeated Command commands = 3;
}

//语义命令：oneof 分支即命令类型（区别于原始按键流）
message Command{
    oneof content{
        MoveDirectionCommand moveDirection = 1;//持续方向移动（键盘直接操纵，调试方便）
        MoveToCommand moveTo = 2;//移动到目标点（未来 RTS 正式移动方式）
        AttackCommand attack = 3;
        BuildCommand build = 4;
        InteractCommand interact = 5;//上下文交互（协作搬运 demo：拾取/放下，无参数，由 Simulate 按位置解析）
    }
}

message InteractCommand{
}

message MoveDirectionCommand{
    UnityMath.Vector3D direction = 1;
}

message MoveToCommand{
    UnityMath.Vector3D target = 1;
}

message AttackCommand{
    uint64 targetObjectId = 1;//目标对象ID
}

message BuildCommand{
    uint32 buildType = 1;//建筑类型（占位，未来扩展）
}

message PlayerSnapshotSync
{
    string name = 1;
    uint64 frameId = 2;//第几帧的快照
    uint64 lastFrameId = 3;//最新的帧序号

    UnityMath.Vector3D pos = 4;
    UnityMath.Vector3D velocity = 5;
}

message ObjectSnapshotSync
{
    uint64 objectId = 1;
    UnityMath.Vector3D pos = 2;
    UnityMath.Vector3D velocity = 3;
}

//物品快照（协作搬运 demo）：位置 + 持有者 + 送达次数
message ItemSnapshotSync
{
    uint32 objectId = 1;
    UnityMath.Vector3D pos = 2;
    string owner = 3;//当前持有者（空 = 自由，可被拾取）
    uint32 deliverCount = 4;//已送达次数
}

message HeartBeat{
    string name = 1;
}

//哈希上报（Desync 检测）：客户端定期上报世界哈希，服务端跨客户端比对
message HashReportMessage{
    string name = 1;
    uint64 frameId = 2;//上报时刻的执行帧号（服务端广播的权威帧号）
    uint32 worldHash = 3;//世界哈希（所有玩家位置 XOR）
}

//Desync 分歧通知（服务端→客户端）：比对不一致时广播
message DesyncNoticeMessage{
    uint64 frameId = 1;//分歧起始帧号
    string detail = 2;//分歧详情（哪几个玩家哈希不一致）
}
